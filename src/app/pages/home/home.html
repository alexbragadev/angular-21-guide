<p-breadcrumb class="max-w-full" [model]="items" />
<div class="home-container">
  <div class="home-buttons">
    <div class="card" style="display:contents">
      @for (button of homeButtonList; track button.label) {
        <p-button [label]="button.label" severity="secondary" [raised]="true" (onClick)="redirect(button.url)" />
      }
    </div>
  </div>
</div>
